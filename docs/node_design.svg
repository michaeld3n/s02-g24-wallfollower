<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
<title id="title">ROS Node Design Diagram</title>
<desc id="desc">Persistent ROS nodes for the standard TurtleBot3 Burger world with the wall follower and a state observer. The bridge supplies laser ranges and simulation time to the wall follower, and joint positions and simulation time to the robot state publisher. The wall follower sends requested motion to the bridge and state to the observer.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="black"/></marker></defs>
<rect width="1400" height="650" fill="white"/>
<g font-family="sans-serif" fill="#111" text-anchor="middle">
<text x="700" y="38" font-size="24">ROS Node Design — Burger wall-following session</text>
<g fill="white" stroke="black" stroke-width="1.5">
<ellipse cx="250" cy="230" rx="220" ry="50"/>
<ellipse cx="790" cy="230" rx="130" ry="50"/>
<ellipse cx="1210" cy="230" rx="155" ry="50"/>
<ellipse cx="790" cy="500" rx="280" ry="50"/>
</g>
<g font-size="18">
<text x="250" y="236">ros_gz_bridge::RosGzBridge</text>
<text x="790" y="236">WallFollowerNode</text>
<text x="1210" y="236">rclpy.node.Node</text>
<text x="790" y="506">robot_state_publisher::RobotStatePublisher</text>
</g>
<g fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)">
<path d="M455 213 Q560 145 675 207"/>
<path d="M410 196 C510 75 760 75 790 178"/>
<path d="M680 257 Q560 345 440 255"/>
<path d="M920 230 L1052 230"/>
<path d="M400 267 Q480 410 590 464"/>
<path d="M300 279 C350 535 470 595 555 528"/>
</g>
<g font-size="17">
<text x="565" y="162">laser_ranges</text>
<text x="630" y="95">simulation_time</text>
<text x="560" y="320">requested_motion</text>
<text x="990" y="212">follower_state</text>
<text x="590" y="390">joint_positions</text>
<text x="405" y="570">simulation_time</text>
</g>
<g font-size="15" fill="#444">
<text x="700" y="607">Ellipses show node classes; one-way arrows show the meaning of published data.</text>
<text x="700" y="633">The observer is a state-echo client. Gazebo is external; start/stop is a service listed in the README.</text>
</g>
</g>
</svg>
