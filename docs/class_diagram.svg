<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Simplified UML Class Diagram</title><desc id="desc">WallFollowerNode inherits rclcpp Node and owns ScanReader and Controller. Controller owns Settings and a retained Command, and reads ScanReader.</desc>
<defs><marker id="triangle" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M1 1L13 7L1 13Z" fill="white" stroke="black"/></marker><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="none" stroke="black"/></marker></defs>
<rect width="1000" height="500" fill="white"/>
<g font-family="sans-serif" text-anchor="middle" fill="#111"><text x="500" y="30" font-size="22">Simplified UML — wall_follower executable</text>
<g fill="white" stroke="black" stroke-width="1.5"><rect x="370" y="55" width="260" height="48"/><rect x="370" y="165" width="260" height="48"/><rect x="95" y="295" width="230" height="48"/><rect x="620" y="295" width="230" height="48"/><rect x="620" y="410" width="270" height="48"/><rect x="75" y="410" width="270" height="48"/></g>
<g font-size="18"><text x="500" y="85">rclcpp::Node</text><text x="500" y="195">WallFollowerNode</text><text x="210" y="325">ScanReader</text><text x="735" y="325">Controller</text><text x="755" y="440">Controller::Settings</text><text x="210" y="440">Controller::Command</text></g>
<g fill="none" stroke="black" stroke-width="1.5"><path d="M500 165L500 104" marker-end="url(#triangle)"/><path d="M410 225L210 270L210 295"/><path d="M590 225L735 270L735 295"/><path d="M735 367L735 410"/><path d="M620 319L326 319" marker-end="url(#arrow)"/><path d="M627 349L345 425"/><path d="M370 189L40 189L40 434L74 434" marker-end="url(#arrow)"/></g>
<g fill="black"><path d="M650 343L640 340L627 349L637 352Z"/><path d="M410 213L416 219L410 231L404 219Z"/><path d="M590 213L596 219L590 231L584 219Z"/><path d="M735 343L741 355L735 367L729 355Z"/></g>
<g font-size="14"><text x="480" y="309">reads</text><text x="485" y="375">retains</text><text x="160" y="179">uses</text><text x="500" y="487">Filled diamond = ownership; hollow triangle = inheritance; arrow = association.</text></g></g></svg>
